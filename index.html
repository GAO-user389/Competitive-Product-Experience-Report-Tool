<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>竞品体验分析报告工作台</title>
    <link rel="stylesheet" href="./styles.css?v=2" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="竞品选择">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" role="img">
              <path d="M7 5.5h13.5L25 10v16.5H7z" fill="none" stroke="currentColor" stroke-width="2" />
              <path d="M20.5 5.5V10H25" fill="none" stroke="currentColor" stroke-width="2" />
              <path d="M11 15h10M11 20h6" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
              <circle cx="21.5" cy="22.5" r="3.2" fill="none" stroke="currentColor" stroke-width="2" />
              <path d="m24 25 2.2 2.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </div>
          <div>
            <h1>竞品体验分析报告工作台</h1>
          </div>
        </div>

        <section class="competitor-panel">
          <div class="section-title">
            <span>竞品选择</span>
            <button class="icon-button" id="addCompetitorBtn" type="button" title="新增竞品" aria-label="新增竞品">+</button>
          </div>
          <div class="search-box">
            <input id="competitorSearch" type="search" placeholder="搜索竞品或行业" autocomplete="off" />
          </div>

          <div class="sub-module">
            <p class="section-kicker">快速筛选</p>
            <div class="segmented" id="filterSegment" role="group" aria-label="快速筛选">
              <button type="button" class="seg is-active" data-filter="all">全部</button>
              <button type="button" class="seg" data-filter="evidence">有证据</button>
              <button type="button" class="seg" data-filter="recent">近 7 天</button>
            </div>
          </div>

          <div class="sub-module">
            <p class="section-kicker">排序</p>
            <div class="segmented" id="sortSegment" role="group" aria-label="排序方式">
              <button type="button" class="seg is-active" data-sort="name">名称</button>
              <button type="button" class="seg" data-sort="updated">最近更新</button>
              <button type="button" class="seg" data-sort="category">赛道</button>
            </div>
          </div>

          <div class="sub-module" id="categoryModule" hidden>
            <p class="section-kicker">赛道</p>
            <div class="category-list" id="categoryList"></div>
          </div>

          <div class="competitor-list" id="competitorList"></div>

          <div class="sidebar-modules">
            <div class="sub-module">
              <p class="section-kicker">统计概览</p>
              <div class="stat-grid" id="statGrid"></div>
            </div>
            <div class="sub-module">
              <p class="section-kicker">快速操作</p>
              <div class="quick-actions">
                <button class="ghost-button" id="sideAddBtn" type="button">新增竞品</button>
              </div>
            </div>
          </div>
        </section>

      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="title-wrap">
            <p class="eyebrow">当前报告</p>
            <input class="title-input" id="productName" aria-label="竞品名称" placeholder="竞品名称" />
          </div>
          <div class="topbar-actions">
            <div class="status-cluster">
              <div class="completion" id="completionChip" title="报告完整度">
                <span class="completion-label">完整度</span>
                <span class="completion-track"><span class="completion-fill" id="completionFill"></span></span>
                <span class="completion-value" id="completionText">0%</span>
              </div>
              <span class="save-state" id="savedState">未保存</span>
            </div>
            <button class="icon-button" id="themeToggle" type="button" aria-label="切换深色 / 浅色" title="切换深色 / 浅色">◑</button>
          </div>
        </header>

        <section class="tab-panel is-active" id="overviewPanel">
          <div class="form-grid">
            <label class="field">
              <span>行业 / 赛道</span>
              <input id="category" type="text" />
            </label>
            <label class="field">
              <span>官网 / 产品链接</span>
              <input id="website" type="url" />
            </label>
            <label class="field">
              <span>目标用户</span>
              <input id="audience" type="text" />
            </label>
            <label class="field">
              <span>是否支持 API 开放</span>
              <select id="apiSupport">
                <option value="未知">未知</option>
                <option value="支持">支持</option>
                <option value="部分支持">部分支持</option>
                <option value="不支持">不支持</option>
              </select>
            </label>
            <label class="field full-span">
              <span>竞品详情</span>
              <textarea id="details" rows="9" placeholder="记录核心定位、关键功能、页面信息、体验观察等文字内容"></textarea>
            </label>
            <div class="upload-panel full-span">
              <div>
                <strong>上传详情图片</strong>
                <p>支持上传截图、页面示意图或功能截图，作为竞品详情的补充材料。</p>
              </div>
              <label class="upload-button">
                <input id="detailImageUpload" type="file" accept="image/*" multiple />
                <span>选择图片</span>
              </label>
              <div class="media-list" id="detailImageList"></div>
            </div>
          </div>
        </section>

        <section class="tab-panel" id="interactionPanel">
          <div class="interaction-layout">
            <div class="flow-editor">
              <div class="field">
                <span>产品使用流程</span>
                <textarea id="interactionText" rows="14" placeholder="示例：&#10;1. 进入首页&#10;2. 选择模板&#10;3. 上传素材&#10;4. 预览结果&#10;5. 导出报告"></textarea>
              </div>
              <div class="flow-actions">
                <label class="inline-select">
                  <span>图形样式</span>
                  <select id="flowStyle">
                    <option value="vertical">纵向步骤</option>
                    <option value="horizontal">横向路径</option>
                    <option value="grid">卡片矩阵</option>
                  </select>
                </label>
                <label class="inline-select">
                  <span>节点形状</span>
                  <select id="nodeShape">
                    <option value="rounded">圆角矩形</option>
                    <option value="rectangle">直角矩形</option>
                    <option value="pill">胶囊形</option>
                    <option value="diamond">菱形</option>
                  </select>
                </label>
                <button class="ghost-button" id="autoFlowBtn" type="button">自动拆分步骤</button>
                <button class="primary-button" id="generateFlowBtn" type="button">生成流程图</button>
                <button class="ghost-button" id="downloadPngBtn" type="button">下载 PNG</button>
                <button class="ghost-button" id="downloadSvgBtn" type="button">下载 SVG</button>
              </div>
            </div>
            <div class="flow-preview" aria-label="图表预览">
              <div class="preview-header">
                <span id="chartPreviewTitle">流程图</span>
                <span id="flowCount">0 步</span>
              </div>
              <div class="flow-canvas" id="flowCanvas"></div>
            </div>
          </div>
        </section>

        <section class="tab-panel" id="analysisPanel">
          <div class="analysis-notice" role="note">
            <span class="analysis-notice-title">提示</span>
            <span class="analysis-notice-body">本页所做的所有选择（呈现形式、是否纳入、文本内容）都会实时同步到「总结」页的报告预览中，并直接决定最终生成的报告内容。调整后可在「总结」页查看实际效果。</span>
          </div>
          <div class="analysis-grid">
            <label class="field analysis-field">
              <span>产品优点（必填）</span>
              <select id="prosFormat" aria-label="产品优点呈现形式">
                <option value="bullets">分点形式</option>
                <option value="numbered">1.2.3 编号</option>
              </select>
              <textarea id="pros" rows="8"></textarea>
              <div class="analysis-preview" id="prosPreview" hidden aria-live="polite"></div>
            </label>
            <label class="field analysis-field">
              <span>产品缺点（必填）</span>
              <select id="consFormat" aria-label="产品缺点呈现形式">
                <option value="bullets">分点形式</option>
                <option value="numbered">1.2.3 编号</option>
              </select>
              <textarea id="cons" rows="8"></textarea>
              <div class="analysis-preview" id="consPreview" hidden aria-live="polite"></div>
            </label>
            <div class="field analysis-field">
              <span>与我方产品的差异（可选）</span>
              <div class="analysis-controls">
                <label><input id="includeDifferences" type="checkbox" /> 纳入报告</label>
                <select id="differencesFormat" aria-label="与我方产品的差异呈现形式">
                  <option value="bullets">分点形式</option>
                  <option value="numbered">1.2.3 编号</option>
                </select>
              </div>
              <textarea id="differences" rows="8"></textarea>
              <div class="analysis-preview" id="differencesPreview" hidden aria-live="polite"></div>
            </div>
            <div class="field analysis-field">
              <span>对我方产品的启发（可选）</span>
              <div class="analysis-controls">
                <label><input id="includeInspirations" type="checkbox" /> 纳入报告</label>
                <select id="inspirationsFormat" aria-label="对我方产品的启发呈现形式">
                  <option value="bullets">分点形式</option>
                  <option value="numbered">1.2.3 编号</option>
                </select>
              </div>
              <textarea id="inspirations" rows="8"></textarea>
              <div class="analysis-preview" id="inspirationsPreview" hidden aria-live="polite"></div>
            </div>
          </div>
        </section>

        <section class="tab-panel" id="evidencePanel">
          <div class="evidence-layout">
            <div class="evidence-composer">
              <div class="form-grid">
                <label class="field">
                  <span>证据类型</span>
                  <select id="evidenceType">
                    <option value="官网信息">官网信息</option>
                    <option value="体验记录">体验记录</option>
                    <option value="截图说明">截图说明</option>
                    <option value="图片 / 视频素材">图片 / 视频素材</option>
                    <option value="用户反馈">用户反馈</option>
                    <option value="价格 / 套餐">价格 / 套餐</option>
                    <option value="API 文档">API 文档</option>
                  </select>
                </label>
                <label class="field">
                  <span>证据标题</span>
                  <input id="evidenceTitle" type="text" placeholder="例如：首页转化入口位置" />
                </label>
                <label class="field full-span">
                  <span>链接 / 文件名</span>
                  <input id="evidenceUrl" type="text" placeholder="官网链接、图片/视频文件名、截图文件名或内部资料编号" />
                </label>
                <label class="field full-span">
                  <span>观察记录</span>
                  <textarea id="evidenceNotes" rows="6" placeholder="写清楚你看到了什么、在哪一步看到、它支撑哪条判断"></textarea>
                </label>
              </div>
              <div class="upload-panel evidence-upload-panel full-span">
                <div>
                  <strong>上传图片 / 视频证据</strong>
                  <p>支持上传截图、页面图片、录屏或案例视频，直接沉淀为一条证据。</p>
                </div>
                <label class="upload-button">
                  <input id="evidenceMediaUpload" type="file" accept="image/*,video/*" multiple />
                  <span>选择素材</span>
                </label>
              </div>
              <div class="flow-actions">
                <button class="primary-button" id="addEvidenceBtn" type="button">添加证据</button>
              </div>
            </div>
            <div class="evidence-list-wrap">
              <div class="preview-header">
                <span>证据库</span>
                <span id="evidenceCount">0 条</span>
              </div>
              <div class="evidence-list" id="evidenceList"></div>
            </div>
          </div>
        </section>

        <section class="tab-panel" id="summaryPanel">
          <div class="summary-layout">
            <div class="report-preview">
              <div class="form-grid" style="grid-template-columns: 1fr;">
                <label class="field full-span">
                  <span>总结（报告结尾的整体判断，可选）</span>
                  <textarea id="summary" rows="5" placeholder="一句话或一段话概括这款竞品给我方带来的核心启示"></textarea>
                </label>
              </div>
              <div class="preview-header">
                <span>报告预览</span>
                <span id="previewDate"></span>
              </div>
              <article id="markdownPreview"></article>
              <div class="summary-actions">
                <button class="ghost-button" id="duplicateBtn" type="button">创建副本</button>
                <button class="ghost-button" id="batchExportBtn" type="button">批量导出</button>
                <button class="primary-button" id="exportBtn" type="button">导出报告</button>
              </div>
            </div>
          </div>
        </section>

        <nav class="tabs" aria-label="报告模块">
          <button class="tab is-active" type="button" data-tab="overview">详情</button>
          <button class="tab" type="button" data-tab="interaction">交互</button>
          <button class="tab" type="button" data-tab="evidence">证据</button>
          <button class="tab" type="button" data-tab="analysis">分析</button>
          <button class="tab" type="button" data-tab="summary">总结</button>
        </nav>
      </main>
    </div>

    <dialog id="exportDialog">
      <form method="dialog">
        <div class="dialog-header">
          <h2>报告导出</h2>
          <select id="exportScope" aria-label="导出范围">
            <option value="current">当前报告</option>
            <option value="all">全部竞品</option>
          </select>
          <select id="exportFormat" aria-label="导出格式">
            <option value="markdown">Markdown · 可粘贴到 Notion / 语雀等</option>
            <option value="plain">纯文本 · 适合飞书聊天直接贴</option>
            <option value="word">Word 格式 · 用 Word 打开后可直接编辑</option>
          </select>
          <button class="icon-button" value="cancel" aria-label="关闭">×</button>
        </div>
        <textarea id="exportText" rows="18" readonly></textarea>
        <div class="dialog-actions">
          <button class="ghost-button" id="downloadWordBtn" type="button">下载 Word</button>
          <button class="ghost-button" id="printPdfBtn" type="button" title="在弹出的打印窗口中选『另存为 PDF』即可导出 PDF 文件">导出 PDF</button>
          <button class="ghost-button" id="copyExportBtn" type="button">复制内容</button>
          <button class="primary-button" value="default">完成</button>
        </div>
      </form>
    </dialog>

    <script src="./app.js?v=2"></script>
  </body>
</html>
